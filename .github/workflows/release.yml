name: Release

# Push a tag like v1.2.3 (or v1.3.0-beta.1 for a pre-release) on `main`
# to build installers for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.3
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (tests must pass before release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.mjs "$TAG"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  create-release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const prerelease = tag.includes('-');
            const { owner, repo } = context.repo;
            // Re-use an existing release for re-runs.
            const existing = (await github.paginate(github.rest.repos.listReleases, { owner, repo }))
              .find((r) => r.tag_name === tag);
            if (existing) return String(existing.id);
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `Marquee ${tag}`,
              draft: true,
              prerelease,
              generate_release_notes: true,
            });
            return String(data.id);

  build:
    needs: create-release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}
      version: ${{ github.event.inputs.tag || github.ref_name }}
      release_id: ${{ needs.create-release.outputs.release_id }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
