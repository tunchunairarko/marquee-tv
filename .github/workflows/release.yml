name: Release

# Push a tag like v1.2.3 (or v1.3.0-beta.1 for a pre-release) on `main`
# to build installers for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.2.3
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (tests must pass before release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/set-version.mjs "$TAG"
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  create-release:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const tag = process.env.TAG;
            const prerelease = tag.includes('-');
            const { owner, repo } = context.repo;
            // Re-use an existing release for re-runs.
            const existing = (await github.paginate(github.rest.repos.listReleases, { owner, repo }))
              .find((r) => r.tag_name === tag);
            if (existing) return String(existing.id);
            const { data } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: `Simple IPTV Player ${tag}`,
              draft: true,
              prerelease,
              generate_release_notes: true,
            });
            return String(data.id);

  build:
    name: Build · ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: ""
            args: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: ""
            args: ""
          - name: Windows x64
            os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        shell: bash
        run: node scripts/set-version.mjs "$TAG"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
