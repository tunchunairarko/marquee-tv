name: Build installers

# Builds the desktop installers for every platform.
#
# * Called by release.yml with a `release_id`: installers are uploaded to that
#   GitHub release.
# * Run manually (Actions → Build installers → Run workflow) to test the whole
#   packaging pipeline without publishing anything: installers are attached to
#   the workflow run as downloadable artifacts instead.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
      version:
        description: Version tag to stamp into the app (e.g. v1.2.3); empty keeps the committed version
        type: string
        default: ""
      release_id:
        description: GitHub release to upload installers to; empty uploads workflow artifacts instead
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main

permissions:
  contents: write

jobs:
  build:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: ""
            args: ""
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: ""
            args: ""
          - name: Windows x64
            os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Set version from tag
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-version.mjs "$VERSION"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ inputs.release_id }}
          uploadWorkflowArtifacts: ${{ inputs.release_id == '' }}
          args: ${{ matrix.args }}
