[package]
name = "marquee"
version = "0.1.0"
description = "A fast, minimal desktop IPTV player"
authors = ["tunchunairarko"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "marquee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-window-state = "2.5"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "gzip", "brotli", "deflate", "system-proxy", "charset"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
url = "2"
rand = "0.9"
percent-encoding = "2"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
